<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>ANEMOS - Staff Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#c4915a;--dark:#1a1614;--dark2:#2a2320;--dark3:#3a3330;--text:#f5f0eb;--text2:#c8bdb5;--text3:#8a7a70;--green:#4caf7d;--red:#e05c5c;--orange:#f5a623;--border:rgba(255,255,255,0.08);--shadow:0 2px 20px rgba(0,0,0,0.3)}
html,body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden}
.staff-header{background:var(--dark2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.staff-logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:500;color:var(--primary);letter-spacing:.12em}
.staff-badge{background:var(--green);color:#fff;font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.05em}
.guest-link{background:rgba(255,255,255,.1);color:var(--text);font-size:.72rem;font-weight:500;padding:5px 12px;border-radius:20px;border:none;cursor:pointer;text-decoration:none;transition:background .2s}
.guest-link:hover{background:rgba(255,255,255,.2)}

.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--dark3);border-bottom:1px solid var(--border)}
.stat{padding:14px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--primary)}
.stat-label{font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

.tabs{display:flex;background:var(--dark2);border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px;text-align:center;font-size:.78rem;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:none;transition:all .2s;border-bottom:2px solid transparent}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.orders-list{padding:16px;display:flex;flex-direction:column;gap:10px}
.order-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:16px;transition:all .2s}
.order-card.pending{border-left:3px solid var(--orange)}
.order-card.accepted{border-left:3px solid var(--green)}
.order-card.done{border-left:3px solid var(--text3);opacity:.6}
.order-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.order-room{background:var(--primary);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px}
.order-time{font-size:.7rem;color:var(--text3)}
.order-msg{font-size:.88rem;color:var(--text);line-height:1.4;margin-bottom:12px}
.order-actions{display:flex;gap:8px}
.btn-accept{background:var(--green);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:.78rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-accept:hover{background:#3a9b6a}
.btn-done{background:var(--dark3);color:var(--text2);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-done:hover{background:rgba(255,255,255,.1)}
.btn-chat{background:rgba(37,211,102,.15);color:#25D366;border:1px solid rgba(37,211,102,.3);border-radius:10px;padding:8px 14px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-chat:hover{background:rgba(37,211,102,.25)}
.status-pill{font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:20px}
.status-pill.pending{background:rgba(245,166,35,.15);color:var(--orange)}
.status-pill.accepted{background:rgba(76,175,125,.15);color:var(--green)}
.status-pill.done{background:rgba(255,255,255,.08);color:var(--text3)}

.chat-panel{height:calc(100vh - 220px);display:flex;flex-direction:column}
.chat-rooms{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--border);padding:0}
.chat-room-btn{flex-shrink:0;padding:10px 16px;font-size:.78rem;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:none;transition:all .2s;border-bottom:2px solid transparent;white-space:nowrap}
.chat-room-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--dark3)}
.chat-body-staff{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:var(--dark)}
.smsg{max-width:78%;display:flex;flex-direction:column}
.smsg.guest{align-self:flex-start}
.smsg.staff{align-self:flex-end}
.smsg-bubble{padding:10px 14px;border-radius:16px;font-size:.85rem;line-height:1.5;word-break:break-word}
.smsg.guest .smsg-bubble{background:var(--dark2);border-radius:4px 16px 16px 16px;color:var(--text)}
.smsg.staff .smsg-bubble{background:var(--primary);border-radius:16px 4px 16px 16px;color:#fff}
.smsg-info{font-size:.65rem;color:var(--text3);margin-top:3px;padding:0 4px}
.smsg.staff .smsg-info{text-align:right}
.staff-input-area{background:var(--dark2);border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:8px}
.staff-input{flex:1;background:var(--dark3);border:1px solid var(--border);border-radius:24px;padding:10px 16px;font-size:.85rem;font-family:'Inter',sans-serif;outline:none;color:var(--text)}
.staff-send{width:44px;height:44px;border-radius:50%;background:var(--primary);border:none;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.staff-send:hover{background:var(--primary-dark)}

.empty-state{padding:60px 20px;text-align:center;color:var(--text3)}
.empty-state .e-icon{font-size:3rem;margin-bottom:12px}
.empty-state p{font-size:.85rem;line-height:1.6}

.notif-banner{background:linear-gradient(135deg,var(--primary),#a87843);margin:16px;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,145,90,.4)}50%{box-shadow:0 0 0 8px rgba(196,145,90,0)}}
.notif-banner .n-icon{font-size:1.5rem}
.notif-banner .n-text strong{display:block;color:#fff;font-size:.88rem;font-weight:600}
.notif-banner .n-text span{color:rgba(255,255,255,.8);font-size:.72rem}

#toast-staff{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#25D366;color:#fff;border-radius:12px;padding:10px 20px;font-size:.82rem;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90%}
#toast-staff.show{opacity:1}
.scroll-pad{height:60px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="staff-header">
  <div class="staff-logo">ANEMOS</div>
  <div class="staff-badge">Staff Panel</div>
  <a href="index.html" class="guest-link">Guest View</a>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-num" id="statPending">0</div><div class="stat-label">Pending</div></div>
  <div class="stat"><div class="stat-num" id="statAccepted">0</div><div class="stat-label">In Progress</div></div>
  <div class="stat"><div class="stat-num" id="statDone">0</div><div class="stat-label">Completed</div></div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-orders" onclick="switchTab('orders')">Orders</button>
  <button class="tab" id="tab-chat" onclick="switchTab('chat')">Chat</button>
</div>

<!-- ORDERS PANEL -->
<div id="panel-orders">
  <div id="ordersList" class="orders-list">
    <div class="empty-state"><div class="e-icon">&#128203;</div><p>No orders yet.<br/>Orders from guests will appear here in real-time.</p></div>
  </div>
  <div class="scroll-pad"></div>
</div>

<!-- CHAT PANEL -->
<div id="panel-chat" class="hidden">
  <div class="chat-rooms" id="chatRooms">
    <button class="chat-room-btn active" onclick="selectRoom('101')">Room 101</button>
    <button class="chat-room-btn" onclick="selectRoom('102')">Room 102</button>
    <button class="chat-room-btn" onclick="selectRoom('103')">Room 103</button>
    <button class="chat-room-btn" onclick="selectRoom('201')">Room 201</button>
    <button class="chat-room-btn" onclick="selectRoom('202')">Room 202</button>
  </div>
  <div class="chat-body-staff" id="staffChatBody">
    <div class="empty-state"><div class="e-icon">&#128172;</div><p>Select a room to start chatting.</p></div>
  </div>
  <div class="staff-input-area">
    <input type="text" class="staff-input" id="staffChatInput" placeholder="Reply to guest..." onkeypress="handleStaffKey(event)"/>
    <button class="staff-send" onclick="sendStaffMsg()">&#10148;</button>
  </div>
</div>

<div id="toast-staff"></div>

<script>
var currentTab = 'orders';
var selectedRoom = '101';
var staffChats = {};

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-orders').classList.toggle('active', tab === 'orders');
  document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');
  document.getElementById('panel-orders').classList.toggle('hidden', tab !== 'orders');
  document.getElementById('panel-chat').classList.toggle('hidden', tab !== 'chat');
}

function showToastStaff(msg) {
  var t = document.getElementById('toast-staff');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function loadOrders() {
  var orders = JSON.parse(localStorage.getItem('anemos_orders') || '[]');
  var pending = orders.filter(function(o) { return o.status === 'pending'; }).length;
  var accepted = orders.filter(function(o) { return o.status === 'accepted'; }).length;
  var done = orders.filter(function(o) { return o.status === 'done'; }).length;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statAccepted').textContent = accepted;
  document.getElementById('statDone').textContent = done;

  var list = document.getElementById('ordersList');
  if (orders.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="e-icon">&#128203;</div><p>No orders yet.<br/>Orders from guests will appear here in real-time.</p></div>';
    return;
  }

  list.innerHTML = '';
  orders.forEach(function(order) {
    var card = document.createElement('div');
    card.className = 'order-card ' + order.status;
    var actions = '';
    if (order.status === 'pending') {
      actions = '<button class="btn-accept" onclick="updateOrder(' + order.id + ',\'accepted\')">Accept</button><button class="btn-chat" onclick="switchTab(\'chat\');selectRoom(\'' + order.room + '\')">Reply Chat</button>';
    } else if (order.status === 'accepted') {
      actions = '<button class="btn-done" onclick="updateOrder(' + order.id + ',\'done\')">Mark Done</button><button class="btn-chat" onclick="switchTab(\'chat\');selectRoom(\'' + order.room + '\')">Reply Chat</button>';
    }
    card.innerHTML =
      '<div class="order-top"><div class="order-room">Room ' + order.room + '</div><span class="status-pill ' + order.status + '">' + (order.status === 'pending' ? 'Pending' : order.status === 'accepted' ? 'In Progress' : 'Done') + '</span><div class="order-time">' + order.time + '</div></div>' +
      '<div class="order-msg">' + order.message + '</div>' +
      (actions ? '<div class="order-actions">' + actions + '</div>' : '');
    list.appendChild(card);
  });
}

function updateOrder(id, status) {
  var orders = JSON.parse(localStorage.getItem('anemos_orders') || '[]');
  orders = orders.map(function(o) { return o.id === id ? Object.assign({}, o, {status: status}) : o; });
  localStorage.setItem('anemos_orders', JSON.stringify(orders));
  loadOrders();
  showToastStaff(status === 'accepted' ? 'Order accepted!' : 'Order marked done!');
}

function selectRoom(room) {
  selectedRoom = room;
  document.querySelectorAll('.chat-room-btn').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');
  renderStaffChat();
}

function renderStaffChat() {
  var body = document.getElementById('staffChatBody');
  var msgs = staffChats[selectedRoom] || [];
  if (msgs.length === 0) {
    body.innerHTML = '<div class="empty-state"><div class="e-icon">&#128172;</div><p>No messages for Room ' + selectedRoom + ' yet.</p></div>';
    return;
  }
  body.innerHTML = '';
  msgs.forEach(function(m) {
    var div = document.createElement('div');
    div.className = 'smsg ' + m.from;
    div.innerHTML = '<div class="smsg-bubble">' + m.text + '</div><div class="smsg-info">' + (m.from === 'guest' ? 'Guest' : 'You') + ' - ' + m.time + '</div>';
    body.appendChild(div);
  });
  body.scrollTop = body.scrollHeight;
}

function handleStaffKey(e) { if (e.key === 'Enter') sendStaffMsg(); }

function sendStaffMsg() {
  var input = document.getElementById('staffChatInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  if (!staffChats[selectedRoom]) staffChats[selectedRoom] = [];
  staffChats[selectedRoom].push({ from: 'staff', text: text, time: new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'}) });
  renderStaffChat();
  showToastStaff('Replied to Room ' + selectedRoom);
}

// Load orders from chat messages too
function loadChatOrders() {
  var orders = JSON.parse(localStorage.getItem('anemos_orders') || '[]');
  orders.filter(function(o) { return o.message && o.message.indexOf('Chat:') === 0; }).forEach(function(o) {
    var room = String(o.room);
    if (!staffChats[room]) staffChats[room] = [];
    var exists = staffChats[room].some(function(m) { return m.id === o.id; });
    if (!exists) {
      staffChats[room].push({ id: o.id, from: 'guest', text: o.message.replace('Chat: ', ''), time: o.time });
    }
  });
}

// Auto-refresh every 3s
setInterval(function() {
  loadChatOrders();
  loadOrders();
  if (currentTab === 'chat') renderStaffChat();
}, 3000);

loadOrders();
loadChatOrders();
</script>
</body>
</html>
